<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="icon" href="logo_tc_light_h24.svg" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--color-text-level1);
            background-color: #101a31;
            background-image:
                radial-gradient(ellipse at 16% 18%, rgba(70, 126, 238, 0.32), transparent 38%),
                radial-gradient(ellipse at 86% 78%, rgba(0, 157, 157, 0.24), transparent 34%),
                radial-gradient(ellipse at 82% 14%, rgba(128, 0, 255, 0.16), transparent 30%),
                linear-gradient(135deg, #101a31 0%, #172440 52%, #0c162b 100%);
            background-attachment: fixed;
            font-family: var(--font-family-base);
            font-size: 16px;
            line-height: 24px;
            position: relative;
            isolation: isolate;
        }

        body::before {
            position: fixed;
            z-index: -1;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 48px 48px;
            content: "";
            mask-image: radial-gradient(ellipse at center, black 10%, transparent 85%);
            pointer-events: none;
        }

        .card {
            width: min(420px, 100%);
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: var(--radius-lg);
            background: rgba(253, 253, 253, 0.94);
            box-shadow: 0 24px 80px rgba(3, 10, 25, 0.38), var(--shadow-line);
            backdrop-filter: blur(16px);
        }

        .brand-logo {
            display: block;
            width: auto;
            max-width: 220px;
            height: 40px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            line-height: 48px;
            font-weight: 700;
        }

        .description {
            margin: 0 0 24px;
            color: var(--color-text-level2);
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 16px;
            line-height: 24px;
        }

        input:focus {
            outline: none;
            border-color: var(--color-primary-main);
            box-shadow: 0 0 0 3px var(--color-primary-hover-bg);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px 16px;
            border: 0;
            border-radius: var(--radius-sm);
            background: var(--color-primary-main);
            color: var(--color-text-white);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            background: var(--color-primary-hover);
            box-shadow: var(--shadow-level1);
        }

        button:active {
            background: var(--color-primary-click);
        }

        button:disabled {
            background: var(--color-primary-disabled);
            cursor: not-allowed;
            box-shadow: none;
        }

        .error {
            min-height: 22px;
            margin: 16px 0 0;
            color: var(--color-error-click);
            font-size: 14px;
            line-height: 22px;
        }

        .hint {
            margin: 20px 0 0;
            color: var(--color-text-level2);
            font-size: 14px;
            line-height: 22px;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 24px;
            }

            h1 {
                font-size: 30px;
                line-height: 46px;
            }
        }

        @media (max-width: 575px) {
            .card {
                border-radius: var(--radius-xl);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="brand-logo" src="logo_tc_light_h24.svg" alt="鴻海科技集團">
        <h1>登录</h1>
        <p class="description">登录以管理你自己的 API Key。</p>
        <form id="login-form">
            <label for="username">用户名</label>
            <input id="username" name="username" placeholder="请填写用户名" autocomplete="username" required autofocus>
            <label for="password">密码</label>
            <input id="password" name="password" type="password" placeholder="请填写密码" autocomplete="current-password" required>
            <button type="submit">登录</button>
            <p class="error" id="login-error" role="alert"></p>
        </form>
        <p class="hint">首次登录的超级管理员账号为 admin / admin123。管理员和新建用户首次登录时必须更改密码。</p>
    </main>
    <script>
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('login-error');

        form.addEventListener('submit', async event => {
            event.preventDefault();
            errorMessage.textContent = '';
            const button = form.querySelector('button');
            button.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: form.username.value,
                        password: form.password.value
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '登录失败。');
                window.location.href = data.user.mustChangePassword ? '/change-password.html' : '/';
            } catch (error) {
                errorMessage.textContent = error.message;
                button.disabled = false;
            }
        });

        fetch('/api/auth/me')
            .then(response => response.ok ? response.json() : null)
            .then(data => {
                if (data && data.user) {
                    window.location.href = data.user.mustChangePassword ? '/change-password.html' : '/';
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
