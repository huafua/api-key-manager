<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="stylesheet" href="design-system.css">
    <link rel="icon" href="logo_tc_light_h24.svg" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--color-text-level1);
            background: var(--color-background);
            font-family: var(--font-family-base);
            font-size: 16px;
            line-height: 24px;
        }

        .card {
            width: min(460px, 100%);
            padding: 32px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: var(--color-background-level1);
            box-shadow: var(--shadow-line);
        }

        .brand-logo {
            display: block;
            width: auto;
            height: 24px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            line-height: 48px;
            font-weight: 700;
        }

        .description {
            margin: 0 0 24px;
            color: var(--color-text-level2);
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 16px;
            line-height: 24px;
        }

        input:focus {
            outline: none;
            border-color: var(--color-primary-main);
            box-shadow: 0 0 0 3px var(--color-primary-hover-bg);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px 16px;
            border: 0;
            border-radius: var(--radius-sm);
            background: var(--color-primary-main);
            color: var(--color-text-white);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            background: var(--color-primary-hover);
            box-shadow: var(--shadow-level1);
        }

        button:active {
            background: var(--color-primary-click);
        }

        button:disabled {
            background: var(--color-primary-disabled);
            cursor: not-allowed;
            box-shadow: none;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .form-actions button {
            flex: 1;
            margin-top: 0;
        }

        .cancel-link {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-level1);
            background: var(--color-background);
            font-weight: 600;
            text-align: center;
            text-decoration: none;
        }

        .cancel-link:hover {
            background: var(--color-background-disabled);
        }

        .cancel-link:focus-visible {
            outline: 3px solid var(--color-primary-main);
            outline-offset: 3px;
        }

        .error {
            min-height: 22px;
            margin: 16px 0 0;
            color: var(--color-error-click);
            font-size: 14px;
            line-height: 22px;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 24px;
            }

            .form-actions {
                flex-direction: column;
            }

            h1 {
                font-size: 30px;
                line-height: 46px;
            }
        }

        @media (max-width: 575px) {
            .card {
                border-radius: var(--radius-xl);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="brand-logo" src="logo_tc_light_h24.svg" alt="鴻海科技集團">
        <h1>修改密码</h1>
        <p class="description">为了保护账号安全，请设置一个至少 8 位的新密码。首次登录时当前密码可以留空。</p>
        <form id="password-form">
            <label for="current-password">当前密码</label>
            <input id="current-password" type="password" autocomplete="current-password">
            <label for="new-password">新密码</label>
            <input id="new-password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
            <label for="confirm-password">确认新密码</label>
            <input id="confirm-password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
            <div class="form-actions">
                <a class="cancel-link" id="cancel-link" href="/" hidden>取消并返回首页</a>
                <button type="submit">保存新密码</button>
            </div>
            <p class="error" id="password-error" role="alert"></p>
        </form>
    </main>
    <script>
        const form = document.getElementById('password-form');
        const errorMessage = document.getElementById('password-error');
        const cancelLink = document.getElementById('cancel-link');
        const button = form.querySelector('[type="submit"]');
        let canCancel = false;

        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '获取登录状态失败。');
                canCancel = !data.user.mustChangePassword;
                cancelLink.hidden = !canCancel || button.disabled;
            } catch (error) {
                errorMessage.textContent = error.message;
            }
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            errorMessage.textContent = '';
            const newPassword = document.getElementById('new-password').value;
            if (newPassword !== document.getElementById('confirm-password').value) {
                errorMessage.textContent = '两次输入的新密码不一致。';
                return;
            }

            button.disabled = true;
            cancelLink.hidden = true;
            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        currentPassword: document.getElementById('current-password').value,
                        newPassword
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '修改密码失败。');
                window.location.href = '/';
            } catch (error) {
                errorMessage.textContent = error.message;
                button.disabled = false;
                cancelLink.hidden = !canCancel;
            }
        });

        loadCurrentUser();
    </script>
</body>
</html>
