# Nginx Reverse Proxy Configuration for Ollama API with API Key Authentication
# This configuration proxies requests to Ollama and validates API keys through the Node.js auth service

upstream ollama_backend {
    # Ollama service endpoint
    server localhost:11434;
    keepalive 32;
}

upstream auth_service {
    # Node.js API Key Manager authentication service
    server localhost:3000;
    keepalive 32;
}

# Map to store authorization status from auth_request
map $auth_status $auth_ok {
    default 0;
    "~^200" 1;
}

# Server block for Ollama API with authentication
server {
    listen 81;
    server_name localhost;

    # Log files for debugging
    access_log logs/ollama_access.log;
    error_log logs/ollama_error.log;

    # Increase buffer sizes for large requests/responses
    client_max_body_size 100M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Health check endpoint - no auth required
    location /health {
        access_log off;
        proxy_pass http://ollama_backend/api/tags;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
    }

    # API Key authentication endpoint
    location /auth/ {
        internal;
        proxy_pass http://auth_service/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Main Ollama API endpoint with authentication
    location /v1/ {
        # Perform API key validation via auth_request
        auth_request /auth/;
        
        # Log rejected requests
        auth_request_set $auth_status $upstream_status;

        # Proxy configuration
        proxy_pass http://ollama_backend/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering configuration for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Ollama chat endpoint with authentication
    location /api/chat {
        auth_request /auth/;
        auth_request_set $auth_status $upstream_status;

        proxy_pass http://ollama_backend/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Important for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Ollama generate endpoint with authentication
    location /api/generate {
        auth_request /auth/;
        auth_request_set $auth_status $upstream_status;

        proxy_pass http://ollama_backend/api/generate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Important for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Ollama embeddings endpoint with authentication
    location /api/embeddings {
        auth_request /auth/;
        auth_request_set $auth_status $upstream_status;

        proxy_pass http://ollama_backend/api/embeddings;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Ollama models list endpoint with authentication
    location /api/tags {
        auth_request /auth/;
        auth_request_set $auth_status $upstream_status;

        proxy_pass http://ollama_backend/api/tags;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Ollama show model details endpoint with authentication
    location /api/show {
        auth_request /auth/;
        auth_request_set $auth_status $upstream_status;

        proxy_pass http://ollama_backend/api/show;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Catch-all endpoint for any other Ollama endpoints with authentication
    location ~ ^/api/(.+)$ {
        auth_request /auth/;
        auth_request_set $auth_status $upstream_status;

        proxy_pass http://ollama_backend/api/$1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # For streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Error handling - return appropriate error responses
    error_page 401 = @error_401;
    error_page 403 = @error_403;

    location @error_401 {
        default_type application/json;
        return 401 '{"error":"Authorization required","message":"Please provide a valid API key via Authorization header"}';
    }

    location @error_403 {
        default_type application/json;
        return 403 '{"error":"Authorization failed","message":"Invalid or disabled API key"}';
    }

    # Root location
    location / {
        return 404 '{"error":"Not Found"}';
        default_type application/json;
    }
}
